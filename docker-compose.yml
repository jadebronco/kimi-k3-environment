# Containerized serving for a GPU host. Default image: SGLang (Moonshot
# recommended). To use vLLM instead, swap the image to vllm/vllm-openai:latest
# and the command to: ["--model", "/models", "--tensor-parallel-size", "8",
# "--max-model-len", "1048576", "--served-model-name", "kimi-k3"]
services:
  kimi-k3:
    image: lmsysorg/sglang:latest
    container_name: kimi-k3
    restart: unless-stopped
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - HF_TOKEN=${HF_TOKEN:-}
    volumes:
      - ${MODEL_DIR:-/data/models/kimi-k3}:/models:ro
    ports:
      - "${PORT:-8000}:30000"
    command: >
      --model-path /models
      --tp-size ${TP_SIZE:-8}
      --context-length ${MAX_MODEL_LEN:-1048576}
      --host 0.0.0.0
      --port 30000
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
